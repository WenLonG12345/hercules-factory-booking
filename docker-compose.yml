services:
  postgres:
    image: postgres:18-alpine
    container_name: hercules-factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hercules_factory
    ports:
      - "5432:5432"
    volumes:
      - hercules_factory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hercules_factory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hercules_factory_postgres:
